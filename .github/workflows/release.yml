name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    env:
      # secrets 上下文不能直接写在 step 的 if 里，先落到 env 再比较。
      # 没配证书时（当前状态）走未签名分支，行为与之前一致。
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # 只有配了 Developer ID 证书才导入钥匙串；签名与公证由 tauri 依据下面的
      # APPLE_* 环境变量自动完成（缺一不可，否则只签名不公证，用户仍会被拦）。
      - name: Import Developer ID certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=actions
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import certificate.p12 -k "$KEYCHAIN" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          rm -f certificate.p12

      - name: Build universal macOS app (signed + notarized)
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target universal-apple-darwin

      - name: Build universal macOS app (unsigned, ad-hoc)
        if: env.HAS_APPLE_CERT != 'true'
        run: pnpm tauri build --target universal-apple-darwin

      - name: Verify signature
        if: env.HAS_APPLE_CERT == 'true'
        run: |
          APP=src-tauri/target/universal-apple-darwin/release/bundle/macos/Marklook.app
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP" || true
          xcrun stapler validate "$APP" || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg artifacts/ || true
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz artifacts/ || true
          ls -la artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: artifacts/*
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" artifacts/
          Get-ChildItem artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: artifacts/*
          if-no-files-found: error

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      # gh 需要在 git 仓库内运行（推断 repo），无 checkout 会报 not a git repository。
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: bundles
          merge-multiple: true

      - name: Record checksums
        run: |
          cd bundles
          shasum -a 256 * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 一步式创建并上传资产（create 与 upload 分离时 GitHub 聚合延迟会 404）；
      # release 已存在（重跑）时 create 失败，退化为仅上传并 clobber。
      - name: Create GitHub Release with assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --title "墨览 Marklook $TAG" --generate-notes bundles/* || \
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber bundles/*
