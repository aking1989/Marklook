name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # WebKit 是 macOS 桌面版（WKWebView）的引擎，Chromium 测不出它的渲染差异。
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests
        run: pnpm test:e2e

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # generate_context! 在编译期嵌入前端产物，cargo 检查前需要先构建 dist。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # wry 在 Windows 动态加载 WebView2Loader.dll（位于 target/debug/），
      # 测试 exe 在 target/debug/deps/，DLL 搜索不含该目录导致
      # STATUS_ENTRYPOINT_NOT_FOUND；复制到 exe 同目录（搜索优先级最高）。
      - name: Stage WebView2Loader.dll next to test binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          # webview2-com-sys 把 dll 复制到其 OUT_DIR（build/webview2-com-sys-*/out），
          # 不在 target/debug 根目录；从 build 目录递归找到后放入 deps（exe 同目录，
          # DLL 搜索优先级最高，覆盖 runner PATH 上的旧版本）。
          $dll = Get-ChildItem -Path target/debug/build -Recurse -Filter WebView2Loader.dll |
            Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll not found under target/debug/build" }
          Copy-Item $dll.FullName target/debug/deps/ -Force
          Get-ChildItem target/debug/deps/WebView2Loader.dll

      - name: Tests (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: src-tauri
        run: cargo test

      # runner 的 JDK bin 在 PATH 上，其自带旧版 UCRT 代理 DLL（api-ms-win-*.dll）
      # 会劫持测试 exe 的 API-set 解析（dumpbin 证实依赖 api-ms-win-core-synch-l1-2-0.dll，
      # Get-Command 证实解析到 JDK 目录副本），导致 STATUS_ENTRYPOINT_NOT_FOUND；
      # 测试前从 PATH 移除 JDK 目录。
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -and $_ -notmatch 'Java_|jdk|temurin' }) -join ';'
          Write-Host "PATH 残留 JDK: $(($env:PATH -split ';' | Where-Object { $_ -match 'Java_|jdk' }).Count)"
          cargo test

      - name: Tests (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          $env:PATH = ($env:PATH -split ';' |
            Where-Object { $_ -and $_ -notmatch 'Java_|jdk|temurin' }) -join ';'
          Write-Host "PATH 残留 JDK: $(($env:PATH -split ';' | Where-Object { $_ -match 'Java_|jdk' }).Count)"
          cargo test

      # 诊断 STATUS_ENTRYPOINT_NOT_FOUND（0xc0000139）：cargo test 编译成功后
      # exe 才存在，故置于 Tests 之后且 always()（失败时也执行）。
      # 列出测试 exe 的导入 DLL，并找 runner 上每个依赖 DLL 的实际解析位置
      # 与版本，确定是哪个 DLL 缺入口点。
      - name: Diagnose test exe imports (Windows)
        if: runner.os == 'Windows' && always()
        working-directory: src-tauri
        shell: pwsh
        run: |
          $exe = Get-ChildItem target/debug/deps/marklook_lib-*.exe |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          Write-Host "exe: $($exe.FullName) size=$($exe.Length)"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$install\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          Write-Host "=== dumpbin /dependents ==="
          $dumpbinOut = & $dumpbin /dependents $exe.FullName
          $dumpbinOut
          $deps = $dumpbinOut | Select-String '\S+\.dll' |
            ForEach-Object { $_.Matches.Value.Trim() } | Sort-Object -Unique
          Write-Host "=== 依赖 DLL 的解析位置 ==="
          foreach ($dep in $deps) {
            $cmd = Get-Command $dep -ErrorAction SilentlyContinue
            if ($cmd) {
              $v = (Get-Item $cmd.Source).VersionInfo.FileVersion
              Write-Host "PATH-RESOLVED: $dep -> $($cmd.Source) (v$v)"
            } else {
              $inDeps = Test-Path "target/debug/deps/$dep"
              Write-Host "NOT-ON-PATH: $dep (in deps dir: $inDeps)"
            }
          }
          Write-Host "=== deps 目录中的 DLL ==="
          Get-ChildItem target/debug/deps/*.dll | ForEach-Object {
            Write-Host "$($_.Name) $($_.Length) $($_.LastWriteTime)"
          }

      - name: Tests
        working-directory: src-tauri
        run: cargo test
