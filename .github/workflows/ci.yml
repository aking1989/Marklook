name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E tests
        run: pnpm test:e2e

  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # generate_context! 在编译期嵌入前端产物，cargo 检查前需要先构建 dist。
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # wry 在 Windows 动态加载 WebView2Loader.dll（位于 target/debug/），
      # 测试 exe 在 target/debug/deps/，DLL 搜索不含该目录导致
      # STATUS_ENTRYPOINT_NOT_FOUND；复制到 exe 同目录（搜索优先级最高）。
      - name: Stage WebView2Loader.dll next to test binaries (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: |
          # webview2-com-sys 把 dll 复制到其 OUT_DIR（build/webview2-com-sys-*/out），
          # 不在 target/debug 根目录；从 build 目录递归找到后放入 deps（exe 同目录，
          # DLL 搜索优先级最高，覆盖 runner PATH 上的旧版本）。
          $dll = Get-ChildItem -Path target/debug/build -Recurse -Filter WebView2Loader.dll |
            Select-Object -First 1
          if (-not $dll) { throw "WebView2Loader.dll not found under target/debug/build" }
          Copy-Item $dll.FullName target/debug/deps/ -Force
          Get-ChildItem target/debug/deps/WebView2Loader.dll

      - name: Tests
        working-directory: src-tauri
        run: cargo test
